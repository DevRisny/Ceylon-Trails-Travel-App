name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build the APK and publish a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the installable APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CeylonTrails-${GITHUB_REF_NAME}.apk
      - uses: softprops/action-gh-release@v2
        with:
          name: Ceylon Trails ${{ github.ref_name }}
          files: CeylonTrails-${{ github.ref_name }}.apk
          body: |
            **Install on an Android phone (Android 7.0+):**
            1. Download `CeylonTrails-${{ github.ref_name }}.apk` below on your phone.
            2. Open it and allow "Install unknown apps" for your browser or Files app when asked.
            3. Open **Ceylon Trails**. Explore, search and Saved work offline; weather, Wikipedia and the World tab need internet.

            This is a debug-signed build for review.
